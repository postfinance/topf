version: 2

builds:
  - main: ./cmd/topf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -w -X main.version={{.Version}}

upx:
  - enabled: true
    goos:
      - linux
    compress: best
    lzma: true

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

dockers_v2:
  - images:
      - ghcr.io/postfinance/topf
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile.goreleaser

release:
  prerelease: auto

homebrew_casks:
  - name: topf
    skip_upload: "{{ if .Prerelease }}true{{ end }}"
    binaries:
      - topf
    repository:
      owner: postfinance
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/postfinance/topf
    description: Talos Orchestrator by PostFinance
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/topf"]
          end

changelog:
  use: github
  sort: asc
