name: dev-release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: latest
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push dev docker images
        run: |
          for img in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'ghcr.io/postfinance/topf:'); do
            arch="${img##*-}"
            docker tag "$img" "ghcr.io/postfinance/topf:dev-${arch}"
            docker push "ghcr.io/postfinance/topf:dev-${arch}"
          done
          docker manifest create ghcr.io/postfinance/topf:dev \
            ghcr.io/postfinance/topf:dev-amd64 \
            ghcr.io/postfinance/topf:dev-arm64
          docker manifest push ghcr.io/postfinance/topf:dev
