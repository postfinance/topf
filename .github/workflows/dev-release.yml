name: dev-release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: latest
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push dev docker images
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/topf"
          for img in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep "${image}:"); do
            arch="${img##*-}"
            docker tag "$img" "${image}:dev-${arch}"
            docker push "${image}:dev-${arch}"
          done
          docker manifest create "${image}:dev" \
            "${image}:dev-amd64" \
            "${image}:dev-arm64"
          docker manifest push "${image}:dev"
