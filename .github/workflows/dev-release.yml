name: dev-release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: latest
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push dev docker images
        run: |
          for img in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'ghcr.io/postfinance/topf:'); do
            arch="${img##*-}"
            docker tag "$img" "ghcr.io/postfinance/topf:dev-${arch}"
            docker push "ghcr.io/postfinance/topf:dev-${arch}"
          done
          docker manifest create ghcr.io/postfinance/topf:dev \
            ghcr.io/postfinance/topf:dev-amd64 \
            ghcr.io/postfinance/topf:dev-arm64
          docker manifest push ghcr.io/postfinance/topf:dev
