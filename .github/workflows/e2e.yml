name: e2e

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/e2e.yml
      - cmd/**
      - internal/**
      - pkg/**
      - test/e2e/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (3 control-plane, upgrade)
    # one e2e cluster at a time per ref: a superseded run is canceled
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    # pinned to match the talosctl-cluster-action's tested runners; needs
    # nested KVM for the qemu provider
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # talosctl-cluster-action requires talosctl v1.14+; pin to the same
      # version as the talos dependency in go.mod so it tracks bumps.
      - name: Install talosctl
        run: |
          TALOSCTL_VERSION="v$(go list -m -f '{{.Version}}' github.com/siderolabs/talos | sed 's/^v//')"
          echo "Installing talosctl ${TALOSCTL_VERSION}"
          curl -fsSLo talosctl "https://github.com/siderolabs/talos/releases/download/${TALOSCTL_VERSION}/talosctl-linux-amd64"
          chmod +x talosctl
          sudo mv talosctl /usr/local/bin/
          talosctl version --client

      - name: Install QEMU and envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf gettext-base

      # The nodes are QEMU VMs, so their RAM is host memory: under an upgrade's
      # transient spike the kernel pages a QEMU process out to swap instead of
      # OOM-killing it (which would read as a flaky test). See
      # https://github.com/home-operations/talosctl-cluster-action#runner-setup
      - name: Enable swap
        run: |
          sudo fallocate -l 8G /mnt/e2e-swapfile
          sudo chmod 600 /mnt/e2e-swapfile
          sudo mkswap /mnt/e2e-swapfile
          sudo swapon /mnt/e2e-swapfile

      # Boots 3 control-plane VMs at v1.14.0 in maintenance mode (no config
      # applied); topf drives the real install/bootstrap flow from there.
      - uses: home-operations/talosctl-cluster-action@fb6a31bf5de43218acc80d2e23958a16eee7380c # v0.2.2
        id: cluster
        with:
          config: test/e2e/cluster.yaml
          cache: true

      - name: Build topf
        run: |
          go build -ldflags "-X main.version=dev" -o bin/topf ./cmd/topf
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Set up topf config
        env:
          CP_IPS: ${{ steps.cluster.outputs.controlplane-ips }}
        run: |
          # the version the VMs booted from (and topf apply installs);
          # must match spec.qemu.talos-version in test/e2e/cluster.yaml
          BOOT_VERSION="$(grep -oP 'talos-version: \Kv\S+' test/e2e/cluster.yaml)"
          echo "Installing Talos ${BOOT_VERSION} on apply"

          IFS=',' read -r CP1_IP CP2_IP CP3_IP <<< "$CP_IPS"
          for ip in "$CP1_IP" "$CP2_IP" "$CP3_IP"; do
            [ -n "$ip" ] || { echo "expected 3 control-plane IPs, got: $CP_IPS"; exit 1; }
          done

          export BOOT_VERSION CP1_IP CP2_IP CP3_IP
          mkdir -p test/e2e/work
          cp -r test/e2e/patches test/e2e/work/patches
          envsubst < test/e2e/topf.yaml.tpl > test/e2e/work/topf.yaml

      # the integration suite covers the whole lifecycle in-process: dry-run
      # on unconfigured nodes, apply + bootstrap, dry-run convergence, a label
      # patch reconciled to the Kubernetes nodes, and the rolling upgrade to
      # the go.mod Talos version. The config path must be absolute: the test
      # binary runs with CWD set to the package dir.
      - name: Run integration tests
        timeout-minutes: 15
        run: |
          go test -tags integration -v -timeout 15m ./internal/integration \
            --topf.config="$PWD/test/e2e/work/topf.yaml" \
            --expected.talos.version="$(go list -m -f '{{.Version}}' github.com/siderolabs/talos | sed 's/^v//')"
